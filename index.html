  <div class="result-card" id="resultCard">

      <div class="rank-emoji" id="rankEmoji"></div>

    <div class="score-section" id="scoreSection"></div>
    <div class="comment-box" id="commentBox"></div>

    <div class="wall-posted-hint" id="wallPostedHint">✅ 你已经发到墙上了，等待开奖 🎁</div>
    <div class="wall-grid" id="wallGrid">
      <div class="wall-empty">加载中...</div>
    </div>
  </div>
</div>
<script>
// ⚙️ 后端地址 — 改成你实际部署的地址
const SUPABASE_URL = 'https://hwsgawbvpkizpgwoybme.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3c2dhd2J2cGtpenBnd295Ym1lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxNjU1NzgsImV4cCI6MjA5MTc0MTU3OH0.6AveHSFyHlBprWFaKp112TElHpdVQHXCx5rFOc2KUmw';

const RANKS = [
  { min:90, emoji:'🔥', name:'Vibe 大神', color:'#ff6b35', sub:'你已经超越了 99% 的普通用户', barColor:'linear-gradient(90deg, #ff6b35, #ff2d55)' },
  { min:75, emoji:'⚡', name:'Prompt 工程师', color:'#a78bfa', sub:'专业级别，稳稳上线没问题', barColor:'linear-gradient(90deg, #7c3aed, #a78bfa)' },
  { min:58, emoji:'🚀', name:'进阶 Coder', color:'#38bdf8', sub:'思路清晰，再加点细节就满分', barColor:'linear-gradient(90deg, #0284c7, #38bdf8)' },
  { min:40, emoji:'🌱', name:'潜力新星', color:'#4ade80', sub:'有想法，继续打磨就能起飞', barColor:'linear-gradient(90deg, #16a34a, #4ade80)' },
  { min:0, emoji:'🐣', name:'青铜 Coder', color:'#fbbf24', sub:'万事开头难，来分享会就对了', barColor:'linear-gradient(90deg, #d97706, #fbbf24)' }
];
const DIMENSIONS = [
  { key:'clarity', label:'指令清晰度', weight:0.30 },
  { key:'detail', label:'细节丰富度', weight:0.25 },
  { key:'creativity', label:'创意指数', weight:0.25 },
  { key:'vibe', label:'Vibe 感', weight:0.20 },
];
const COMMENTS = {
  high: ['细节拉满，AI 收到这条 prompt 会当场感动落泪。粒子、物理、动效全有，上线不是梦。','这条 prompt 已经具备"工程思维"——你不只是在描述需求，你在定义边界。分享会见！','看完这条 prompt，我觉得你已经不需要来分享会了。但还是来吧，认识一下志同道合的人。'],
  mid: ['方向对了，细节还差一口气。加上"物理效果""性能要求"或"具体风格"，AI 会给你惊喜。','有想法有场景，就是描述还有点抽象。AI 最怕模糊——具体到"什么感觉""什么效果"。','不错的 prompt，但 AI 需要更多"约束"才能给你想要的结果。试试加上尺寸、颜色、交互细节。'],
  low: ['AI 看完这条 prompt 陷入了沉思……它不知道该从哪下手。来分享会学学怎么"喂"好 AI。','这条 prompt 让 AI 开始自由发挥了，结果可能和你想的完全不一样。具体化是关键！','好消息：你有想法。坏消息：AI 不会读心术。来分享会，学会把想法翻译成 prompt。']
};

function scorePrompt(text) {
  const t = text.trim(); const len = t.length;
  const hasVerb = /做|生成|创建|写|设计|实现|帮我|给我/.test(t);
  const hasNoun = /游戏|页面|动画|效果|组件|界面|功能|系统/.test(t);
  let clarity = 30;
  if (hasVerb) clarity += 25; if (hasNoun) clarity += 25;
  if (len > 30) clarity += 10; if (len > 80) clarity += 10;
  clarity = Math.min(clarity, 100);
  const detailWords = /粒子|物理|弹射|碎裂|颜色|大小|速度|动效|渐变|阴影|圆角|响应式|移动端|流畅|丝滑|炫酷|简洁|极简/.test(t);
  const hasNumber = /\d+/.test(t);
  let detail = 20;
  if (detailWords) detail += 40; if (hasNumber) detail += 20;
  if (len > 50) detail += 15; if (len > 100) detail += 5;
  detail = Math.min(detail, 100);
  const creativeWords = /薯队长|大富翁|打砖块|跑酷|消消乐|弹幕|烟花|随机|procedural|vibe|魔法|科技感|赛博|像素|复古/.test(t);
  let creativity = 25;
  if (creativeWords) creativity += 45;
  if (t.includes('，') || t.includes(',')) creativity += 15;
  if (len > 60) creativity += 15;
  creativity = Math.min(creativity, 100);
  const vibeWords = /牛逼|炸裂|爆炸|超酷|惊艳|漂亮|完美|绝了|有意思|好玩|有趣|感动|震撼/.test(t);
  let vibe = 30;
  if (vibeWords) vibe += 35;
  if (/吧|呢|哦|～|！|!/.test(t)) vibe += 20;
  if (len > 50) vibe += 15;
  vibe = Math.min(vibe, 100);
  const jitter = () => Math.round((Math.random() - 0.5) * 16);
  return {
    clarity: Math.min(100, Math.max(10, clarity + jitter())),
    detail: Math.min(100, Math.max(10, detail + jitter())),
    creativity: Math.min(100, Math.max(10, creativity + jitter())),
    vibe: Math.min(100, Math.max(10, vibe + jitter())),
  };
}
function totalScore(s) { return Math.round(DIMENSIONS.reduce((sum, d) => sum + s[d.key] * d.weight, 0)); }
function getRank(score) { return RANKS.find(r => score >= r.min); }
function getComment(score) { const pool = score >= 75 ? COMMENTS.high : score >= 45 ? COMMENTS.mid : COMMENTS.low; return pool[Math.floor(Math.random() * pool.length)]; }
function fakeLoading(ms) { return new Promise(r => setTimeout(r, ms)); }
let lastResult = null;

async function runEvaluate() {
  const input = document.getElementById('promptInput');
  const text = input.value.trim();
  if (!text || text.length < 5) { input.focus(); input.style.borderColor = 'rgba(255,80,80,0.6)'; setTimeout(() => input.style.borderColor = '', 1000); return; }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>AI 正在评估你的 Prompt...';
  document.getElementById('resultCard').classList.remove('show');
  await fakeLoading(1400 + Math.random() * 600);
  const scores = scorePrompt(text); const total = totalScore(scores);
  const rank = getRank(total); const comment = getComment(total);
  lastResult = { text, scores, total, rank, comment };
  renderResult(lastResult);
  btn.disabled = false; btn.innerHTML = '开始测试段位 ⚡';
}

function renderResult({ scores, total, rank, comment }) {
  document.getElementById('rankEmoji').textContent = rank.emoji;
  document.getElementById('rankName').textContent = rank.name;
  document.getElementById('rankName').style.color = rank.color;
  document.getElementById('rankSub').textContent = `总分 ${total} 分 · ${rank.sub}`;
  const section = document.getElementById('scoreSection');
  section.innerHTML = DIMENSIONS.map(d => `<div class="score-item"><div class="score-row"><span class="score-label">${d.label}</span><span class="score-val" style="color:${rank.color}">${scores[d.key]}</span></div><div class="score-bar"><div class="score-fill" id="fill_${d.key}" style="background:${rank.barColor}"></div></div></div>`).join('');
  const commentBox = document.getElementById('commentBox');
  commentBox.textContent = comment; commentBox.style.borderColor = rank.color;
  document.getElementById('resultCard').classList.add('show');
  // 如果还没发到墙上，显示发墙按钮
  if (wallUser) {
    const wallBtn = document.getElementById("resultWallPostBtn");
    if (wallBtn) {
      const alreadyPosted = lastResult._wallPosted;
      wallBtn.style.display = alreadyPosted ? "none" : "block";
      wallBtn.textContent = alreadyPosted ? "✅ 已发到墙上" : "🏆 发到墙上，参与评奖";
    }
  }
  setTimeout(() => { DIMENSIONS.forEach(d => { const el = document.getElementById(`fill_${d.key}`); if (el) el.style.width = scores[d.key] + '%'; }); }, 100);
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function retry() {

  document.getElementById('promptInput').value = '';
  document.getElementById('charCount').textContent = '0';
  document.getElementById('promptInput').focus();
  window.scrollTo({ top: 0, behavior: 'smooth' });

function goSignup() { window.open('https://city.xiaohongshu.com/questionnaire/1775032697489','_blank'); }

// ── 结果墙功能 ──
let wallUser = null; // Hi 登录后的用户信息

// 通过 Hi 内部 API 获取用户信息（从浏览器 cookie）
async function getHiUserFromBrowser() {
  const endpoints = [
    'https://edith.xiaohongshu.com/api/sns/v1/user/selfinfo2',
    'https://edith.xiaohongshu.com/api/sns/v1/user/selfinfo',
    'https://edith.xiaohongshu.com/api/sns/v1/user/me',
    'https://edith.xiaohongshu.com/api/gateway/v1/user/me',
  ];
  for (const ep of endpoints) {
    try {
      const res = await fetch(ep, { credentials: 'include' });
      if (!res.ok) continue;
      const data = await res.json();
      // 尝试不同格式的响应
      const userInfo = data.data?.user || data.data || data.user || null;
      if (userInfo && (userInfo.userId || userInfo.user_id || userInfo.nickname)) {
        return {
          nickname: userInfo.nickname || userInfo.user_info?.nickname || 'Hi用户',
          userId: userInfo.userId || userInfo.user_id || userInfo.redid || '',
          avatar: userInfo.images?.headv1 || userInfo.avatar || userInfo.image || ''
        };
      }
    } catch(e) { /* 端点不通，试下一个 */ }
  }
  return null;
}

async function wallLogin() {
  const btn = document.getElementById('wallLoginBtn');
  btn.textContent = '登录中...'; btn.disabled = true;
  
  // 先尝试从浏览器 Hi cookie 获取
  const hiUser = await getHiUserFromBrowser();
  if (hiUser && hiUser.userId) {
    wallUser = hiUser;
    btn.style.display = 'none';
    document.getElementById('wallUserBadge').textContent = '✅ ' + hiUser.nickname;
    document.getElementById('wallUserBadge').classList.add('show');
    checkWallPosted();
    return;
  }
  
  // 浏览器 Hi cookie 获取失败，弹框手动输入
  btn.textContent = 'Hi 登录未检测到，请手动输入';
  btn.disabled = false;
  const nickname = prompt('请在 Hi 登录状态下重试，或手动输入你的薯名：');
  if (nickname && nickname.trim()) {
    wallUser = { nickname: nickname.trim(), userId: nickname.trim(), avatar: '' };
    btn.style.display = 'none';
    document.getElementById('wallUserBadge').textContent = '👤 ' + nickname.trim();
    document.getElementById('wallUserBadge').classList.add('show');
    checkWallPosted();
  }
}

async function checkWallPosted() {
  if (!wallUser) return;
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/wall_posts?select=user_id&order=created_at.desc', {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
      });
    const data = await res.json();
    if (Array.isArray(data) && data.some(w => w.user_id === wallUser.userId)) {
      document.getElementById('wallPostBtn').style.display = 'none';
      document.getElementById('wallPostedHint').classList.add('show');
    } else {
      document.getElementById('wallPostBtn').classList.add('show');
    }
  } catch(e) {}
}

// 从结果卡片直接发墙
function postToWallFromResult() {
  if (!wallUser) {
    wallLogin();
    return;
  }
  postToWall();
}

async function postToWall() {
  if (!wallUser) { alert('请先 Hi 登录'); return; }
  if (!lastResult) { alert('请先测试段位'); return; }
  const btn = document.getElementById('wallPostBtn');
  btn.textContent = '发送中...'; btn.disabled = true;
  try {
    const scoresArr = DIMENSIONS.map(d => ({ label: d.label, value: lastResult.scores[d.key] }));
    const res = await fetch(SUPABASE_URL + '/rest/v1/wall_posts', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',

        'Authorization': 'Bearer ' + SUPABASE_KEY,

      },

        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),

        prompt_text: lastResult.text,

      })
    });
    if (res.ok) {
      btn.style.display = 'none';
      document.getElementById('wallPostedHint').classList.add('show');
      loadWall();
    } else {
      alert(data.error || '发送失败');
    }
  } catch(e) {
    alert('网络错误：' + e.message);

function renderWall(posts) {
  const grid = document.getElementById('wallGrid');
  document.getElementById('wallCount').textContent = posts.length > 0 ? posts.length + ' 人已发' : '';
  if (posts.length === 0) {
    grid.innerHTML = '<div class="wall-empty">还没有人发到墙上，来做第一个吧 🎉</div>';
    return;
  }
  grid.innerHTML = posts.map(w => `
    <div class="wall-card">
      <div class="wall-card-top">
        <div class="wall-card-avatar">${w.avatar ? '<img src="'+w.avatar+'" onerror="this.parentElement.innerHTML=\'🦀\'"/>' : '🦀'}</div>
        <span class="wall-card-name">${esc(w.nickname)}</span>
        <span class="wall-card-time">${w.time}</span>
      </div>
      <div class="wall-card-rank">
        <span class="wall-card-rank-emoji">${w.rank.emoji}</span>
        <span class="wall-card-rank-name" style="color:${w.rank.color}">${w.rank.name}</span>
        <span class="wall-card-rank-total">${w.total}分</span>
      </div>
      <div class="wall-card-prompt">${esc(w.text)}</div>
      <div class="wall-card-scores">
        ${(w.scores||[]).map(s => `<div class="wall-card-score">${s.label} <span>${s.value}</span></div>`).join('')}
      </div>
    </div>
  `).join('');
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function loadWall() {
  try {
    const res = await fetch(SUPABASE_URL + '/rest/v1/wall_posts?order=created_at.desc', {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    });
    const data = await res.json();
    if (Array.isArray(data)) {
      const wallData = data.map(d => ({
        nickname: d.nickname || '匿名用户',
        userId: d.user_id || '',
        avatar: d.avatar || '',
        text: d.prompt_text || '',
        scores: d.scores || [],
        total: d.total || 0,
        rank: d.rank || {},
        time: d.created_at ? new Date(d.created_at).toLocaleString('zh-CN', {timeZone:'Asia/Shanghai'}) : ''
      }));
      renderWall(wallData);
    }
  } catch(e) {
    document.getElementById('wallGrid').innerHTML = '<div class="wall-empty">加载失败，请稍后重试</div>';
  }
}

// 页面加载时获取结果墙
loadWall();
